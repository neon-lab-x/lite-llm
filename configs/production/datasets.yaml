# Scaled to ~20B total tokens (from ~30B) to match 1.0B model.

# Named filters (referenced by datasets below)
filters:
  fineweb_edu:
    description: "int_score >= 2"
    field: int_score
    op: ">="
    value: 2

  chinese:
    description: ">= 15% Chinese characters, >= 100 chars"
    type: chinese
    min_length: 100
    min_ratio: 0.15

# Datasets
datasets:
  # --- English web text (educational, high quality) ---
  - name: fineweb_edu
    hf_path: HuggingFaceFW/fineweb-edu
    split: train
    text_column: text
    filter: fineweb_edu
    target_tokens: 8_000_000_000

  # --- English web text (general, broader coverage) ---
  # NOTE: HuggingFaceFW/fineweb has per-crawl configs (CC-MAIN-20xx-xx).
  # Without specifying one, streaming iterates all crawls. If the default
  # config fails, add: config: CC-MAIN-2024-10  (or another recent crawl).
  - name: fineweb_general
    hf_path: HuggingFaceFW/fineweb
    split: train
    text_column: text
    filter: null
    target_tokens: 4_000_000_000

  # --- Chinese web text ---
  - name: fineweb_edu_chinese
    hf_path: opencsg/Fineweb-Edu-Chinese-V2.1
    split: train
    text_column: text
    filter: chinese
    target_tokens: 3_500_000_000

  # --- Math (high quality) ---
  - name: finemath_4plus
    hf_path: HuggingFaceTB/finemath
    config: finemath-4plus
    split: train
    text_column: text
    filter: null
    target_tokens: 2_000_000_000

  # --- Math (broader, quality >= 3) ---
  - name: finemath_3plus
    hf_path: HuggingFaceTB/finemath
    config: finemath-3plus
    split: train
    text_column: text
    filter: null
    target_tokens: 1_500_000_000

  # --- Code (multi-language, 30 languages from GitHub BigQuery) ---
  # Source: codeparrot/github-code — 115M files, 873 GB, 30 programming languages.
  # No terms acceptance required. Covers Python, JavaScript, Java, C++, Go, Rust,
  # TypeScript, C, C#, Ruby, PHP, Shell, SQL, HTML, CSS, Scala, etc.
  - name: github_code
    hf_path: codeparrot/github-code
    split: train
    text_column: content
    filter: null
    min_doc_length: 20           # code snippets can be short but meaningful
    target_tokens: 800_000_000
