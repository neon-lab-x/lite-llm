# Active default recipe: zh_first_v1_3b.
#
# This is the engineering/MVP run. It keeps the same source mix as the 20B
# recipe but scales targets down so the full data->tokenize->train->eval loop is
# practical before committing to the formal run.
recipe_name: zh_first_v1_3b
raw_output_dir: data/production/raw_zh_first_3b
output_dir: data/production/tokenized_zh_first_3b

sampling:
  seed: 20260527
  file_order: shuffled
  row_group_order: shuffled
  row_order: shuffled
  json_shuffle_buffer: 4096

disk:
  min_free_gb: 80
  max_cache_gb: 60

datasets:
  - name: zh_fineweb_edu_v21
    source: opencsg/Fineweb-Edu-Chinese-V2.1
    target_tokens: 1_400_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_chinese_ratio: 0.35
      min_quality_score: 3
      quality_columns: [score, int_score, quality_score]
      add_eos: true

  - name: baai_cci3_hq
    source: BAAI/CCI3-HQ
    target_tokens: 500_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_chinese_ratio: 0.35
      prefer_high_score: true
      add_eos: true

  - name: skypile_150b
    source: Skywork/SkyPile-150B
    target_tokens: 300_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_chinese_ratio: 0.35
      add_eos: true

  - name: zh_cosmopedia
    source: opencsg/chinese-cosmopedia
    target_tokens: 200_000_000
    text_field: text
    filters:
      min_chars: 300
      max_chars: 12000
      min_chinese_ratio: 0.40
      add_eos: true

  - name: en_fineweb_edu
    source: HuggingFaceFW/fineweb-edu
    target_tokens: 200_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_quality_score: 3
      quality_columns: [int_score, score]
      add_eos: true

  - name: finemath_4plus
    source: HuggingFaceTB/finemath
    subset: finemath-4plus
    target_tokens: 250_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 16000
      add_eos: true

  - name: github_code_clean
    source: codeparrot/github-code-clean
    target_tokens: 150_000_000
    text_columns: [code, content, text]
    filters:
      min_chars: 100
      max_chars: 20000
      allowed_languages:
        - Python
        - JavaScript
        - TypeScript
        - Java
        - Go
        - Rust
        - C
        - C++
        - Markdown
      add_eos: true
