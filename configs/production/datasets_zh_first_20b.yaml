# Chinese-first formal pretraining recipe for the ~1.0B Lite-LLM base model.
# Active target is 19B tokens plus a disabled 1B reserved experiment slot.
recipe_name: zh_first_v1_20b
output_dir: /root/autodl-fs/tokenized_zh_first_20b

sampling:
  seed: 20260527
  file_order: shuffled
  row_group_order: shuffled
  row_order: shuffled
  json_shuffle_buffer: 4096

disk:
  min_free_gb: 80
  max_cache_gb: 60

datasets:
  - name: zh_fineweb_edu_v21
    source: opencsg/Fineweb-Edu-Chinese-V2.1
    target_tokens: 9_000_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_chinese_ratio: 0.35
      min_quality_score: 3
      quality_columns: [score, int_score, quality_score]
      add_eos: true

  - name: baai_cci3_hq
    source: BAAI/CCI3-HQ
    target_tokens: 3_000_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_chinese_ratio: 0.35
      prefer_high_score: true
      add_eos: true

  - name: skypile_150b
    source: Skywork/SkyPile-150B
    target_tokens: 2_000_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_chinese_ratio: 0.35
      add_eos: true

  - name: zh_cosmopedia
    source: opencsg/chinese-cosmopedia
    target_tokens: 1_200_000_000
    text_field: text
    filters:
      min_chars: 300
      max_chars: 12000
      min_chinese_ratio: 0.40
      add_eos: true

  - name: en_fineweb_edu
    source: HuggingFaceFW/fineweb-edu
    target_tokens: 1_200_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 12000
      min_quality_score: 3
      quality_columns: [int_score, score]
      add_eos: true

  - name: finemath_4plus
    source: HuggingFaceTB/finemath
    subset: finemath-4plus
    target_tokens: 1_600_000_000
    text_field: text
    filters:
      min_chars: 200
      max_chars: 16000
      add_eos: true

  - name: github_code_clean
    source: codeparrot/github-code-clean
    target_tokens: 1_000_000_000
    text_columns: [code, content, text]
    filters:
      min_chars: 100
      max_chars: 20000
      allowed_languages:
        - Python
        - JavaScript
        - TypeScript
        - Java
        - Go
        - Rust
        - C
        - C++
        - Markdown
      add_eos: true

  - name: reserved_experiment
    source: null
    target_tokens: 1_000_000_000
    enabled: false
