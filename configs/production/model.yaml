# Production model architecture with MLA + SwiGLU + RoPE + QK-Norm.
# vocab_size is padded up from the Qwen3.5-0.8B tokenizer (len=248077) to 248320
# so it is a multiple of 128 -> friendlier for tensor-core matmul.
model_type: "lite_llm"
vocab_size: 248320

# Hidden / FFN / depth
hidden_size: 2048
intermediate_size: 5504
num_hidden_layers: 24

# Attention (MLA with low-rank latent Q / KV projections)
attention_type: "mla"
num_attention_heads: 16
head_dim: 128
q_lora_rank: 512
kv_lora_rank: 192
qk_norm: true

# Positional encoding
max_position_embeddings: 8192
rope_theta: 10000.0             # keep RoPE base fixed at 10000

# Normalization
rms_norm_eps: 1.0e-6

# Initialization
initializer_range: 0.02

# Weight tying (embedding <-> lm_head)
tie_word_embeddings: true
