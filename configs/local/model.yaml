# Tiny MLA model config for local smoke tests (CPU-friendly).
model_type: "lite_llm"
vocab_size: 256
hidden_size: 64
intermediate_size: 128
num_hidden_layers: 2

# Tiny MLA: hidden = 4 * 16 = 64
attention_type: "mla"
num_attention_heads: 4
head_dim: 16
q_lora_rank: 16
kv_lora_rank: 16
qk_norm: true

max_position_embeddings: 256
rope_theta: 10000.0
rms_norm_eps: 1.0e-6
initializer_range: 0.02
tie_word_embeddings: true
