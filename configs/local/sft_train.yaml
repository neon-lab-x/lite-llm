# Local SFT smoke-test training config (CPU-friendly).

# --- Output ---
output_dir: "./artifacts/local/sft_checkpoints"
resume_from_last_checkpoint: false
seed: 42

# --- Pretrained model (dummy checkpoint generated by sft_prepare_data.py) ---
pretrained_model_path: "./artifacts/local/sft_pretrained"

# --- Data ---
max_seq_length: 128
data_dir: "./data/local_smoke/sft"
tokenizer_name: "Qwen/Qwen3.5-0.8B"
val_fraction: 0.2

# --- Optimizer (lower LR for fine-tuning) ---
learning_rate: 5.0e-5
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.95
max_grad_norm: 1.0

# --- Scheduler ---
lr_scheduler_type: "cosine"
warmup_ratio: 0.1

# --- Batch ---
per_device_train_batch_size: 1
gradient_accumulation_steps: 1

# --- Precision ---
bf16: false
gradient_checkpointing: false
use_cpu: true

# --- Runtime ---
max_steps: 4
num_train_epochs: 1
dataloader_num_workers: 0
dataloader_pin_memory: false

# --- Logging ---
logging_steps: 1
logging_dir: "./artifacts/local/sft_logs"
report_to: "none"

# --- Checkpointing ---
save_steps: 2
save_total_limit: 2
