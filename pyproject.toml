[project]
name = "lite-llm"
version = "0.1.0"
description = "From-scratch causal LM pre-training project with Grouped-Query Attention."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.26.0,<2",
    "numpy>=1.26.0,<3",
    "pyyaml>=6.0",
    "torch>=2.1.0,<3",
    "transformers>=4.38.0,<6",
]

[project.optional-dependencies]
production = [
    "datasets>=2.16.0,<5",
    "deepspeed>=0.13.0,<1",
    "huggingface_hub>=0.23.0,<2",
    "wandb>=0.16.0,<1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
